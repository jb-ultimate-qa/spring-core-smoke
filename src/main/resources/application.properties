spring.application.name=spring-core-smoke
spring.profiles.active=dev

# Consumed by scheduled/ReportJob#generateNightlyReport - navigation anchor for the Scheduled test
report.cron=0 0 4 * * *

# Keeps @Cacheable on a plain ConcurrentMapCacheManager, no external cache needed
spring.cache.type=simple

spring.datasource.url=jdbc:h2:mem:smoke
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
